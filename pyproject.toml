[project]
name = "kludge-cli"
version = "0.1.0"
description = "Remap Royal Kludge keyboard keys from the command line (a CLI port of Kludge Knight)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["hidapi", "typer"]

[project.scripts]
rkkb = "rkkb:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["rkkb.py"]
